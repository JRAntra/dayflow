# DayFlow for iOS. Run `xcodegen` in this folder to make DayFlow.xcodeproj (it isn't committed).
# Before installing on your iPhone, pick your team under Signing & Capabilities in Xcode, or set
# DEVELOPMENT_TEAM below (a free Apple ID's "Personal Team" works).
name: DayFlow
options:
  bundleIdPrefix: com.jrantra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0-beta.1
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  DayFlowCore:
    path: Packages/DayFlowCore

targets:
  DayFlow:
    type: application
    platform: iOS
    sources:
      - path: DayFlow
      - path: Shared
      # The built-in sounds, shared with the Mac app; bundled as a "sounds" folder.
      - path: ../assets/sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: DayFlowCore
      - target: DayFlowWidgets
        embed: true
    entitlements:
      path: DayFlow/DayFlow.entitlements
      properties:
        # Shares today's blocks with the widgets. If your free Apple ID can't sign this,
        # delete these lines here and in DayFlowWidgets below; only the widgets stop working.
        com.apple.security.application-groups:
          - group.com.jrantra.dayflow
    info:
      path: DayFlow/Info.plist
      properties:
        CFBundleDisplayName: DayFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.jrantra.dayflow.refresh
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: DayFlow reads the calendars you choose so it can remind you before meetings start.
        NSCalendarsUsageDescription: DayFlow reads the calendars you choose so it can remind you before meetings start.
        # dayflow://today, used by the Live Activity and widgets.
        CFBundleURLTypes:
          - CFBundleURLName: com.jrantra.dayflow
            CFBundleURLSchemes:
              - dayflow
        # Your Clips folder and backups show in the Files app under On My iPhone › DayFlow
        # (it takes both of these).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: DayFlow uses the microphone only when you record a clip.
        # "Open in DayFlow" for export files (AirDrop, Files, Mail).
        CFBundleDocumentTypes:
          - CFBundleTypeName: DayFlow schedule
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
          # Share or AirDrop a sound to DayFlow to make it a clip. "Alternate": DayFlow is offered,
          # never the default app for audio.
          - CFBundleTypeName: Sound clip
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - com.microsoft.waveform-audio
              - public.mpeg-4-audio
              - public.aac-audio
              - org.xiph.ogg-audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jrantra.dayflow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: DayFlow

  DayFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DayFlowWidgets
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: DayFlowWidgets/DayFlowWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jrantra.dayflow
    info:
      path: DayFlowWidgets/Info.plist
      properties:
        CFBundleDisplayName: DayFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jrantra.dayflow.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

  DayFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DayFlowUITests
    dependencies:
      - target: DayFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jrantra.dayflow.uitests
        TEST_TARGET_NAME: DayFlow
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DayFlow:
    build:
      targets:
        DayFlow: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DayFlowUITests
